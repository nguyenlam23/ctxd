{% extends 'admin/base.html' %}
{% block content %}
<script type='text/javascript'>
  function change_password(){
    $.post('{{ settings.BASE_URL}}/admin/change_password_p/', {
          'nickname': $('input[name=nickname]').val(),
          'old_password': $('input[name=old_password]').val(),
          'new_password': $('input[name=new_password]').val()
        }, function(data){
          if(data.state=='success')
            alert(' thao tác thành công ')
          else
            alert(data.msg)
          }, 'json')
  }
</script>
<h2> sửa chữa </h2>

<p>
</p>
<p> nick name ：<input name='nickname' value="{{nickname}}"/></p>
<p> trước mặt mật mã ：<input name='old_password' /></p>
<p> tân mật mã ：<input name='new_password' /></p>
<p><input type='button' value=' đệ trình ' onclick='change_password()' /></p>

{% endblock %}
