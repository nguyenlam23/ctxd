{% extends 'admin/base.html' %}
{% block content %}
<script type='text/javascript'>
  function change_sessionid(){
    var args = {}
    var new_sessionid = $("#new_sessionid").val();
    if (new_sessionid == ''){
      alert(' mật mã bất năng vi Trống ');
      return false;
    }
    args['new_sessionid'] = $("#new_sessionid").val();
    args['session_key'] = '{{udict.uid}}';
    $.post('{{ settings.BASE_URL}}/admin/app_user/change_sessionid/', args,
         function(data){
          if(data.state=='success')
            alert(' nặng đưa thành công ');
          else
            alert(' xuất hiện lệch lạc: '+data.msg)
          }, 'json')
  }

function succ(){
$('#desc').show();
setTimeout("$('#desc').hide()",4000)
}



</script>

<div>
  <form id="frm"action="{{settings.BASE_URL}}/admin/app_user/view_session_key/"method="post">
     Tên nhân vật：<input id="session_key"name="session_key"
    value="{{session_key}}"/>
    <input type="radio"{%ifequal exact 1%}checked="checked"{%endifequal%} id="exact"name="exact"value="1"/> Kiểm Tra Chính Xác
    <input type="radio"{%ifequal exact 0%}checked="checked"{%endifequal%} id="exact"name="exact"value="0"/> Kiểm Tra Không Chính Xác 
    <select name="zone"id="zone">
      {%for item in zone_list%}
      <option {%ifequal item.0 zone%}selected=selected{%endifequal%} value="{{item.0}}">{{item.1}}</option>
      {%endfor%}
    </select>
  <input type="submit"value="&nbsp; tra &nbsp;&nbsp; hoa &nbsp;"/>
  </form>
</div>
<div>
  <form id="frm"action="{{settings.BASE_URL}}/admin/app_user/view_user_tel/"method="post">

  </form>
</div>

    <input id="view_type"type="hidden"name="view_type"value="tel"/>

</td>

{%endfor%}
