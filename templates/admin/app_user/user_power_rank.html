{% extends 'admin/base.html' %}
{% block content %}
<script type='text/javascript'>
  var activeZone = undefined;
  var current_content_open = 0;

  $(document).ready(function () {
    var zone = $nx.request.getUrlParam('zone', window);
    if (zone) {
      view_user_power_rank(zone);
      window.location.hash="#"+ zone;
    };

  });
  function view_user_power_rank(zone, refresh){
    if (activeZone!== zone) {
      $('#'+activeZone).removeClass('active-zone');
      $('#'+zone).addClass('active-zone');
      activeZone = zone;
    }
    var params = {zone: zone};
    if (refresh) {
      params['refresh'] = refresh;
    }
    $nx.request.postfs('app_user/user_power_rank/', params, function (data) {
      $('#power_rank_body').html(data.power_rank_body)
      current_content_open = data.content_open;
      refresh_content_open_state();
    })
  };
  function refresh_power_rank(){
    view_user_power_rank(activeZone, true)
  };
  function refresh_content_open_state() {
    if (current_content_open === 1) {
      $('#content_open').val(' thu hồi kể lại ');
      $('.dynamic-display').css("display","");
    } else {
      $('#content_open').val(' kiểm tra kể lại ');
      $('.dynamic-display').css("display","none");
    }
  };
  function change_content_open() {
    if (current_content_open === 0) {
      current_content_open = 1;
      refresh_content_open_state();
    } else {
      current_content_open = 0;
      refresh_content_open_state();
    }
  };

  function open_view_player_modal(uid, uname, player_data) {
    var title = ' bồi ngoạn số liệu - ' + uid + '(' + uname + ')';
    $("#view_player_title").text(title);
    $("#player_data").text(player_data);
    $('#view_player').show();
  }
  function close_view_player_modal () {
    $('#view_player').hide();
  }

  // đương điểm kích khuông thái khuông bên ngoài đích ý khu vực thì đóng khuông thái khuông 
  window.onclick = function(event) {
    if (event.target == $('#view_player')[0]) {
      close_view_player_modal();
    }
  }
</script>

<style type="text/css">
body,td,th {
	font-size: 14px;
}
table
{
	border-collapse:collapse;
}
td
{
	padding-left:5px;
	padding-top:5px;
	padding-bottom:5px;
	padding-right:5px;
}
input {
	font-family: Verdana, Arial, Helvetica, sans-serif;
	font-size: 12px;
	}
</style>

{%if zone_list%}
<div class="zone-list">
  <table>
    {%for item in zone_list%}
    <tr>
      {%for k,v in item%}
        <td align="left">
          <input id='{{ k }}' value='{{v}}' type="button"onclick="view_user_power_rank('{{k}}');"/>
        </td>
      {%endfor%}
    </tr>
    {%endfor%}
  </table>
</div>
{%endif%}
<div id="power_rank_body"></div>

<div id="view_player"class="modal">
 <!-- Modal content -->
 <div class="modal-content">
  <div class="modal-header">
   <span class="modal-close"onclick="close_view_player_modal()">x</span>
   <h2>
     <span id="view_player_title"></span>
   </h2>
  </div>
  <div class="modal-body"style="height: 600px;overflow-y:scroll">
    <textarea id="player_data"name="player_data"style="width: 90%; height: 500px"></textarea>
  </div>
 </div>
</div>
{% endblock %}
