{% extends 'admin/base.html' %}
{% block content %}
<script type='text/javascript'>
  function admin_pay(pid,pay_money){
    var args = {}
    args['uid'] = '{{uid}}';
    args['zone'] = '{{zone}}';
    args['pid'] = pid;
    if (confirm(' xác định sung trị '+pid+'--'+pay_money+' nguyên?')){
    $.post('{{ settings.BASE_URL}}/admin/app_user/admin_pay/', args,
         function(data){
          if(data.state=='success')
            succ_pay(data.pay_ids);
          else
            alert(' xuất hiện lệch lạc: '+data.msg)
          }, 'json')
    }
  }
  


function succ_pay(pay_ids){
$('#pay_succ').show();
setTimeout("$('#pay_succ').hide()",4000)
$('#pay_ids').val(pay_ids);
}

function view_user(zone){
$('#zone').val(zone);
$('#uid').val('{{uid}}');
$('#frm').submit();
}

</script>
