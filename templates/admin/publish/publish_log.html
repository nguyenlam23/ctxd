{% if admin_logs %}
<table border="1"cellpadding="0"cellspacing="0">
  <tr>
    <td> tuyên bố nhân </td>
    <td> tuyên bố thời gian </td>
    <td> tuyên bố phối trí </td>
  </tr>
  {% for item in admin_logs %}
    <tr>
      <td>
        {{ item.admin_user }}
      </td>
      <td>
        {{ item.subtime }}
      </td>
      <td>
        {% for c in item.modify_config_list %}
          <a href="{{settings.BASE_URL}}/admin/system/{{take_config_type}}/?config_name={{ c.1 }}"target="_blank"style="color: blue">{{ c.0 }}</a>
        {% endfor %}
      </td>
    </tr>
  {% endfor %}
</table>
{% endif %}
