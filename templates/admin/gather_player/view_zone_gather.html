{% extends 'admin/base.html' %}
{% block content %}

<script src="{{settings.MEDIA_URL}}/js/jquery-1.12.3.min.js"type="text/javascript"></script>
<link REL="stylesheet"href="{{settings.MEDIA_URL}}/bootstrap/bootstrap-3.3.7-dist/css/bootstrap.min.css"TYPE="text/css">
<link REL="stylesheet"href="{{settings.MEDIA_URL}}/bootstrap/bootstrap-table/bootstrap-table.min.css"TYPE="text/css">

<script src="{{settings.MEDIA_URL}}/bootstrap/bootstrap-3.3.7-dist/js/bootstrap.min.js"type="text/javascript"></script>
<script src="{{settings.MEDIA_URL}}/bootstrap/bootstrap-table/bootstrap-table.js"type="text/javascript"></script>
<script src="{{settings.MEDIA_URL}}/bootstrap/bootstrap-table/locale/bootstrap-table-zh-CN.min.js"type="text/javascript"></script>

<script type='text/javascript'>

  var activeZone= undefined;
  var useOrderBy = undefined;
  var activeStatus = undefined;

  $(document).ready(function () {
    $("#batch_change").click(function () {
      var uids = [];
      $("#zone_player_data").bootstrapTable('getSelections').forEach(function (item) {
        uids.push(item.uid)
      })
      if (uids.length == 0) {
        alert(' thỉnh tuyển trạch cần thao tác gỗ cốp pha ')
        return
      }
      modify_player_status(uids.join(','), 1)
    })
  });
  
  function get_zone_mod_data(zoneID) {
    if (activeZone!= undefined) {
      $('#zone_'+activeZone).removeClass('btn-danger');
      $('#zone_'+activeZone).addClass('btn-default');
    }
    $('#zone_'+zoneID).removeClass('btn-default');
    $('#zone_'+zoneID).addClass('btn-danger');
    $nx.request.getfs('gather_player/get_zone_mod_data/', {'zone': zoneID}, function (data) {
      $("#zone_mod_data").html(data.zone_mod_data_html);
      $("#zone_player_data").bootstrapTable('removeAll');
    })
    activeZone = zoneID;
  };

  function screen_by_status(status) {
    if (activeStatus!= undefined) {
      $('#status_'+activeStatus).removeClass('btn-danger');
      $('#status_'+activeStatus).addClass('btn-default');
    }
    $('#status_'+status).removeClass('btn-default');
    $('#status_'+status).addClass('btn-danger');
    activeStatus = status;
    var $table = $("#zone_player_data");
    if ($table.bootstrapTable('getOptions').url) {
      $table.bootstrapTable('refresh');
    } else {
      $("#tableTool").show();
      $table.bootstrapTable('destroy');
      $table.bootstrapTable({
        method:"get",
        url:"{{settings.BASE_URL}}/admin/gather_player/get_zone_player_data/",
        onLoadSuccess: function () {
        },
        queryParams: 'queryParams',
        pagination: 'true',
        sidePagination: 'server',
        toolbar: '#tableTool',
        loadingFontSize: 10,
        pageList: [20, 50, 100],
        pageSize: 20,
        columns: [
          {checkbox: 'true'},
          {field: 'uid', title: ' gỗ cốp pha ID', sortable: 'true', width: 100,
            formatter: function (value, row) {
              var s = '';
              s += '<a href="{{settings.BASE_URL}}/admin/gather_player/?uid=' + row.uid + '"target="_blank">' + row.uid + '</a>'
              return s
            }
          },
          {field: 'uname', title: 'Uname', width: 120,
            formatter: function (value, row) {
              var s = '';
              if (value) {
                s += '<a href="{{settings.BASE_URL}}/admin/app_user/view_app_user/?uid=' + row.uid + '"target="_blank">' + row.uname + '</a>'
              } else {
                s += '-'
              }
              return s
            }
          },
          {field: 'add_time', title: ' đăng kí thời gian ', width: 100, sortable: 'true'},
          {field: 'last_time', title: ' thu thập thời gian ', width: 100, sortable: 'true'},
          {field: 'login_time', title: ' đăng ký thời gian ', width: 100, sortable: 'true'},
          {field: 'building_lv', title: ' biệt thự ', width: 50},
          {field: 'office_lv', title: ' tước vị ', width: 50},
          {field: 'pay_money', title: ' sung trị kim ngạch ', width: 80},
          //{field: 'kill_num', title: ' đánh chết '},
          //{field: 'build_count', title: ' kiến thiết '},
          {field: 'power', title: ' chiến lực ', width: 100},
          //{field: 'best_hero_power', title: ' đan tương tối cao chiến lực '},
          {field: 'hero_list', title: ' cực mạnh Anh Hùng ', width: 380,
            formatter: function (value, row) {
              var s = '';
              if (value) {
                value.forEach(function (item, index) {
                  s += '<a onclick="window.open(\'{{settings.BASE_URL}}/admin/gather_player/get_player_hero_dict/?data_id=' + row.last_did + '&hid=' + item[0] + '\',\'newwindow\',\'height=800,width=600,top=0,left=0,toolbar=no,menubar=no,scrollbars=no,resizable=no,location=no,status=no\') ;"href="javascript:void(0);">' + item[2] + item[1] + ',</a>'
                })
              } else {
                s += '-'
              }
              return s
            }
          },
          {field: 'score', title: ' cho điểm ', width: 50, sortable: 'true'},
          {field: 'days', title: ' thiên ', width: 50, sortable: 'true'},
          {field: 'times', title: ' thứ ', width: 50, sortable: 'true'},
          {field: 'join_num', title: ' ví dụ thực tế ', width: 50,
            formatter: function (value, row) {
              if (value> 0) {
                var s = '<a href="{{settings.BASE_URL}}/admin/app_user/view_app_user/?uid=' + row.user_zone + '"target="_blank">' + value + '</a>'
              } else {
                var s = value
              }
              return s
            }
          },
          {field: 'status', title: ' trạng thái ', width: 80, sortable: 'true',
            formatter: function (value, row) {
              return '<font color="' + row.status_cn[1] + '">' + row.status_cn[0] + '</font>'
            }
          },
          {field: 'menu', title: ' thao tác ', width: 130,
            formatter: function (value, row) {
              var s = '<div class="btn-group btn-group-xs"role="group">';
              value.forEach(function (item, index) {
                if (item[2] == 0) {
                  s += '<button type="button"class="btn btn-primary btn-xs"disabled="disabled"onclick="modify_player_status(' + row.uid + ',' + item[1] + ')">' + item[0] + '</button>';
                } else {
                  s += '<button type="button"class="btn btn-primary btn-xs"onclick="modify_player_status(' + row.uid + ',' + item[1] + ')">' + item[0] + '</button>';
                }
              })
              s += '</div>'
              return s;
            }
          },
       ]
      })
    }
  }

  function queryParams(params) {
    delete params.search
    if (params.order == 'desc') {
      params.order_by = '-'+params.sort
    } else {
      params.order_by = params.sort
    }
    if (params.order_by!= undefined) {
      useOrderBy = params.order_by
    }
    if (params.order_by == undefined && useOrderBy) {
      params.order_by = useOrderBy
    }
    delete params.order
    delete params.sort
    if (activeStatus) {
      params.status = activeStatus
    }
    params.zone = activeZone
    return params
  }
  
  function modify_player_status(uids, status) {
    var kwargs = {
      'uids': uids,
      'status': status
    };

    if (status == 2) {
      if (confirm(' có hay không vứt đi cai gỗ cốp pha ？')) {
        $nx.request.postfs('gather_player/modify_player_status/', kwargs, function (data) {
          if (data.state=='success') {
            $nx.request.getfs('gather_player/get_zone_mod_data/', {'zone': activeZone}, function (data) {
              $("#zone_mod_data").html(data.zone_mod_data_html);
              $('#status_'+activeStatus).removeClass('btn-default');
              $('#status_'+activeStatus).addClass('btn-danger');
              $("#zone_player_data").bootstrapTable('refresh');
            })
          } else {
            alert(' xuất hiện lệch lạc: '+data.msg)
          }
        })
      }
    } else {
      $nx.request.postfs('gather_player/modify_player_status/', kwargs, function (data) {
        if (data.state=='success') {
          $nx.request.getfs('gather_player/get_zone_mod_data/', {'zone': activeZone}, function (data) {
            $("#zone_mod_data").html(data.zone_mod_data_html);
            $('#status_'+activeStatus).removeClass('btn-default');
            $('#status_'+activeStatus).addClass('btn-danger');
            $("#zone_player_data").bootstrapTable('refresh');
          })
        } else {
          alert(' xuất hiện lệch lạc: '+data.msg)
        }
      })
    }
  };
</script>

<style type="text/css">

.table> tbody> tr> td {
  vertical-align: middle;
}
.row {
  padding: 5px 5px 0px 5px;
}
</style>

<div class="container-fluid">
  <div class="row">
    <div class="panel panel-default">
      <div class="panel-heading">
        <p> lớn nhất thu thập số trời <font
         color="red">{{mould_day.1}}</font> thiên ，<font
         color="red">{{mould_day.0}}</font> thiên đã ngoài nhưng đăng dùng ， lớn nhất thu thập <font
         color="red">{{mould_times.1}}</font> thứ ，<font
         color="red">{{mould_times.0}}</font> thứ đã ngoài nhưng đăng dùng </p>
      </div>
      <div class="panel-body">
        <div class="row">
          {% for item in zone_list%}
          <button class="btn btn-default btn-sm"type="button"
            id="zone_{{item.0}}"onclick="get_zone_mod_data('{{item.0}}')">{{item.1}}</button>
          {% endfor %}
        </div>
      </div>
    </div>
  </div>
  <div class="row"id="zone_mod_data">
  </div>
  <div class="row">
    <div class="row"id="tableTool"style="display: none; margin-left: 2px">
      <button id="batch_change"class="btn btn-primary"> nhóm lượng đăng dùng </button>
    </div>
    <div id="zone_player_data">
    </div>
  </div>
</div>
{% endblock %}
