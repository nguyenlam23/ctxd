{% extends 'admin/base.html' %}
{% block content %}
<script type='text/javascript'>
    function change_password(){
        $.post('{{ settings.BASE_URL}}/admin/change_password_p/', {
                    'nickname': $('input[name=nickname]').val(),
                    'old_password': $('input[name=old_password]').val(),
                    'new_password': $('input[name=new_password]').val()
                }, function(data){
                    if(data.state=='success')
                        alert('操作成功')
                    else
                        alert(data.msg)
                    }, 'json')
    }
</script>
<h2>修改</h2>

<p>
</p>
<p>昵称：<input name='nickname' value="{{nickname}}"/></p>
<p>当前密码：<input name='old_password' /></p>
<p>新密码：<input name='new_password' /></p>
<p><input type='button' value='提交' onclick='change_password()' /></p>

{% endblock %}
