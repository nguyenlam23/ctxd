<div class="modal-dialog" role="document">
    <div class="modal-content">
        <div class="modal-header">
            <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
            <h4 class="modal-title" id="editZoneTitle">
                {% ifequal action 'edit' %}
                编辑区服
                {% endifequal %}
                {% ifequal action 'add' %}
                添加新服
                {% endifequal %}
                {% ifequal action 'active' %}
                开区
                {% endifequal %}
            </h4>
        </div>
        <div class="modal-body">
            <form class="form-horizontal">
                <div class="form-group">
                    <label class="col-md-3 control-label">所属分组</label>
                    <div class="col-md-9">
                        <select id="zone_group" class="form-control">
                            {% for item in zone_group_select %}
                                <option value="{{ item.id }}" {% ifequal item.id zone.zone_group %}selected=true{% endifequal %}>{{ item.text }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label class="col-md-3 control-label">区服ID</label>
                    <div class="col-md-9">
                        <input type="text" class="form-control" id="edit_zone_id" {% ifnotequal action 'add' %}disabled{% endifnotequal %} value="{{ zone.zone_id }}">
                        <input type="hidden" value="{{ action }}" id="edit_action">
                    </div>
                </div>
                <div class="form-group">
                    <label class="col-md-3 control-label">区服名</label>
                    <div class="col-md-9">
                        <input type="text" class="form-control" id="edit_zone_name" value="{{ zone.zone_name }}">
                    </div>
                </div>
                <div class="form-group">
                    <label class="col-md-3 control-label">主机IP/域名</label>
                    <div class="col-md-9">
                        <input type="text" class="form-control" id="edit_host" value="{{ zone.host }}">
                    </div>
                </div>
                <div class="form-group">
                    <label class="col-md-3 control-label">端口号</label>
                    <div class="col-md-9">
                        <input type="text" class="form-control" id="edit_port" value="{{ zone.port }}">
                    </div>
                </div>
                <div class="form-group">
                    <label class="col-md-3 control-label">开服时间</label>
                    <div class="col-md-9">
                        <input type="text" class="form-control" id="edit_open_time" value="{{ zone.open_time }}" autocomplete="off">
                    </div>
                </div>
                <div class="form-group">
                    <label class="col-md-3 control-label">合服状态</label>
                    <div class="col-md-9">
                        <select id="edit_merge_times" class="form-control" {% ifnotequal action 'add' %}disabled{% endifnotequal %}>
                            {% for item in merge_times_select %}
                                <option value="{{ item.id }}" {% ifequal item.id zone.merge_times %}selected=true{% endifequal %}>{{ item.text }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label class="col-md-3 control-label">被合次数</label>
                    <div class="col-md-9">
                        <input type="text" class="form-control" id="edit_op_merge_times" value="{{ zone.op_merge_times }}">
                    </div>
                </div>
                <div class="form-group">
                    <label class="col-md-3 control-label">注册限制</label>
                    <div class="col-md-9">
                        <label class="radio-inline col-md-2">
                            <input type="radio" name="edit_register_limit" value="0" {% ifequal zone.register_limit 0 %}checked{% endifequal %}>
                            <span class="label label-danger">限制</span>
                        </label>
                        <label class="radio-inline col-md-2">
                            <input type="radio" name="edit_register_limit" value="1" {% ifequal zone.register_limit 1 %}checked{% endifequal %}>
                            <span class="label label-success">关闭</span>
                        </label>
                    </div>
                </div>
                <div class="form-group">
                    <label class="col-md-3 control-label">强行推荐</label>
                    <div class="col-md-9">
                        <label class="radio-inline col-md-2">
                            <input type="radio" name="edit_recommend" value="0" {% ifequal zone.recommend 0 %}checked{% endifequal %}>
                            <span class="label label-default">正常</span>
                        </label>
                        <label class="radio-inline col-md-2">
                            <input type="radio" name="edit_recommend" value="1" {% ifequal zone.recommend 1 %}checked{% endifequal %}>
                            <span class="label label-success">推荐</span>
                        </label>
                    </div>
                </div>
                <div class="form-group">
                    <label class="col-md-3 control-label">区服标签</label>
                    <div class="col-md-9">
                        <label class="radio-inline col-md-2">
                            <input type="radio" name="edit_state" value="0" {% ifequal zone.state 0 %}checked{% endifequal %}>
                            <span class="label label-default">无</span>
                        </label>
                        <label class="radio-inline col-md-2">
                            <input type="radio" name="edit_state" value="1" {% ifequal zone.state 1 %}checked{% endifequal %}>
                            <span class="label label-danger">爆</span>
                        </label>
                        <label class="radio-inline col-md-2">
                            <input type="radio" name="edit_state" value="2" {% ifequal zone.state 2 %}checked{% endifequal %}>
                            <span class="label label-success">新</span>
                        </label>
                        <label class="radio-inline col-md-2">
                            <input type="radio" name="edit_state" value="3" {% ifequal zone.state 3 %}checked{% endifequal %}>
                            <span class="label label-warning">测</span>
                        </label>
                    </div>
                </div>
            </form>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-primary" onclick="submit_edit_zone()">提交</button>
        </div>
    </div>
</div>
