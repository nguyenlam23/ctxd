{% extends 'admin/base.html' %}
{% block content %}
<script type='text/javascript'>
function view_user(zone){
$('#zone').val(zone);
$('#uid').val('{{uid}}');
$('#frm').submit();
}
function chose_zone(zone){
    $("#zone_"+zone).attr('selected', 'selected');
}
</script>
<div>
    <form id="frm" action="{{settings.BASE_URL}}/admin/msg/msg_view_user/" method="post">
        用户ID：<input id="uid" name="uid" value=""/>
        <input id="view_uid" name="view_uid" value="1" type="hidden"/>
    <br />
    <input type="submit" value="查询" />
    </form>
</div>
<br/>
<div>
    <form id="frm" action="{{settings.BASE_URL}}/admin/msg/re_msg/" method="post">
        Uid|Zone：{{bug_msg.uid}}<br/>
    <br />

<textarea id="content" name="content" style="width: 60%; height: 100px"></textarea>
</br>
<input type="hidden" id="uid" name="uid_zone" value="{{bug_msg.uid}}"/>
    <input type="submit" value="发送信息" />
    </form>
</div>
<br/>
{%if bug_msg.data%}
   <table>
       <tr>
           <td>
    <form id="frm" action="{{settings.BASE_URL}}/admin/msg/pass_msg/" method="post">
        <input type="hidden" id="uid" name="uid_zone" value="{{bug_msg.uid}}"/>
    <input style="color:green;" type="submit" value="忽&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; 略" />
    </form>
           </td>
           <td>
    <form id="frm" action="{{settings.BASE_URL}}/admin/msg/mark_msg/" method="post">
        <input type="hidden" id="uid" name="uid_zone" value="{{bug_msg.uid}}"/>
    <input style="color:red;" type="submit" value="置为疑难问题" />
    </form>
           </td>
           <td>
   {%if up_uid%}
   <a href="{{settings.BASE_URL}}/admin/msg/msg_view_user/?uid_zone={{up_uid}}">上一个</a>
   {%endif%}
   {%if next_uid%}
   <a href="{{settings.BASE_URL}}/admin/msg/msg_view_user/?uid_zone={{next_uid}}">下一个</a>
   {%endif%}
           </td>
       </tr>
   </table>

        <table border=1 width="100%">

            <tr>
                <td>
                    提交时间
                </td>
                <td width="80%">
                   内容 
                </td>
            </tr>
            {%for item in bug_msg.data%} 
            <tr>
                <td>
                    {{item.time}}
                </td>
                <td>
                    <font 
                        {%ifequal item.st 1%}color="green"{%endifequal%}
                        {%ifequal item.st 2%}color="red"{%endifequal%}
                        {%ifequal item.st 3%}color="green"{%endifequal%}
                        >
                    {{item.content}}
                    </font>
                </td>
            </tr>

            {% endfor %}
        </table>



    {%endif%}

{% endblock %}
