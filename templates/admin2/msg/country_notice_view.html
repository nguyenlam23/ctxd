{% extends 'admin/base.html' %}
{% block content %}
<style type="text/css">
/*分页*/
div.page {
	padding:5px;
	font-family:Arial, Helvetica, sans-serif;
	margin-left:10px;
	background:#eee;
	margin-top:20px;
	text-align:center;
	padding-top:6px;
	color:#336699;
}
div.page a {
	padding:0px 5px; margin:2px; color:#336699; background:#eee; text-decoration:none;
}
div.page a:hover {
	color:#3399cc; background:#fff
}
div.page span.current {
	padding:0px 5px; font-weight:bold; margin:2px; color:#336699; background:#fff;
}
div.page span.disabled {
	padding:0px 5px; margin:2px; color:#797979;
}
/*分页结束*/


</style>
<script type='text/javascript'>
</script>

<h2>最新国家公告</h2>
<table border=1 width="100%">
    <tr>
        <td width="200px">
            区服
        </td>
        <td width="100px">
            国家
        </td>
        <td width="200px">
            提交时间
        </td>
        <td style="table-layout: fixed;word-break: break-all;">
            公告内容
        </td>
    </tr>
    {%for item in notice_list%}
    <tr>
        <td>
           <a href="{{settings.BASE_URL}}/admin/app_user/view_world/?zone={{item.zone}}">{{item.zone}}</a>
            &nbsp;&nbsp;&nbsp;
            <a href="{{settings.BASE_URL}}/admin/app_user/chat_log/?zone={{item.zone}}">查看详细</a>
        </td>
        <td>
            {{ item.country }}
        </td>
        <td>
            {{item.update_time}}
        </td>
        <td>
            {{item.content}}
        </td>

    </tr>
    {% endfor %}
    <tr>
        <td colspan="16">
         <div class="page" style="background:#fff; margin-left:0; font-size:12px;">
{{p.render|safe}}
        </div>
        </td>
    </tr>
</table>

{% endblock %}
