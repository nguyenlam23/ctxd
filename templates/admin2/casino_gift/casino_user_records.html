{% extends 'admin/base.html' %}
{% block content %}
<script src="{{settings.MEDIA_URL}}/js/jquery-1.12.3.min.js" type="text/javascript"></script>
<script type='text/javascript' src='{{settings.BASE_URL}}/static/js/jquery-ui-1.12.1/jquery-ui.min.js'></script>
<link rel="stylesheet" href="{{settings.BASE_URL}}/static/js/jquery-ui-1.12.1/jquery-ui.min.css" type="text/css"/>

<script type='text/javascript'>
    function statistic(){
        var from_date = $("#from_date").val()
        var to_date = $("#to_date").val()
        if (from_date && to_date){
        if (from_date > to_date){
        alert('请正确选择时间区间')
            return false;
        }
        }
    }
$(function() {
		var dates = $('#from_date, #to_date').datepicker({
            dateFormat: "yy-mm-dd",
			defaultDate: "-1",
			changeMonth: true,
			numberOfMonths: 1,
            maxDate: "+0",
            minDate: "2010-04-15",
			onSelect: function(selectedDate) {
                statistic();
			}
		});

	});
</script>
<style type="text/css">

</style>

<h2>购买记录</h2>
<form id="cform" action="{{settings.BASE_URL}}/admin/casino_gift/casino_user_records/" method="post" target="mainFrame">

    From：<input readonly size="10" name="from_date"  id="from_date" value="{{from_date}}" /> 
    To：<input readonly size="10" name="to_date"  id="to_date" value="{{to_date}}" /> 
    <input type = "submit" value = "查询" />
</form>
{%if record_list%}
<table border="1" cellpadding="0" cellspacing="0">
    <tr>
        <td>
            日期
        </td>
        <td>
            购买次数
        </td>
        <td>
            购买人数
        </td>
        <td>
            消耗(cchip)
        </td>
        <td>
        </td>
    </tr>
    {%for item  in record_list%}
    <tr>
        <td>
            {{item.day}}
        </td>
        <td>
            {{item.times}}
        </td>
        <td>
            {{item.ps}}
        </td>
        <td>
            {{item.pay_cchip}}
        </td>
        <td>
            {%ifequal item.day 'total'%}
            {%else%}
            <a href="{{settings.BASE_URL}}/admin/casino_gift/casino_user_records_day/{{item.day}}/">查看详细</a>
            {%endifequal%}
        </td>
    </tr>
    {%endfor%}
</table>
{%endif%}


{% endblock %}
