{% extends 'admin/base.html' %}
{% block content %}
<style type="text/css">
*{ margin:0; padding:0;}
.imglist { width:650px; margin:0 auto;}
.imglist li { width:100px; height:100px; list-style:none; float:left; border:5px solid white; margin:10px;}
.imglist li img { width:100px; height:100px;}
.fntlist font.border { border-color:red;}
</style>
<script src="{{settings.MEDIA_URL}}/js/jquery-1.12.3.min.js" type="text/javascript"></script>
<script type='text/javascript' src='{{settings.BASE_URL}}/static/js/jquery-ui-1.12.1/jquery-ui.min.js'></script>
<link rel="stylesheet" href="{{settings.BASE_URL}}/static/js/jquery-ui-1.12.1/jquery-ui.min.css" type="text/css"/>
<script type='text/javascript' src='{{settings.MEDIA_URL}}/js/reward_content.js?v=22'></script>
<script type='text/javascript'>
    function chk(){ 
        return true;
    }

    function change_gift_type(){ 
        var gift_type = $('#gift_type').val();
        var gt = document.getElementById(gift_type).value;
        if (gt==1){
            $('#gift_content_td').text('数量');
            $('#kami_content').hide();
            $('#gift_num').show();
        }else{
            $('#gift_content_td').text('卡密');
            $('#kami_content').show();
            $('#gift_num').hide();
        }
    }

</script>
<h2>
筹码商城-奖品添加
</h2>
<br/>
<form action="{{settings.BASE_URL}}/admin/casino_gift/add_casino_gift_p/" method="post" enctype="multipart/form-data" onsubmit="return chk();">
<table width="100%">
    <tr>
        <td width="10%">
            奖品类型
        </td>
        <td>
            <select name="gift_type" id="gift_type" onchange="change_gift_type();">
                {%for item in gift_type_list%}
                <option value="{{item.0}}">{{item.2}}|{{item.0}}</option>
                {%endfor%}
            </select>
                {%for item in gift_type_list%}
                <input type="hidden" id="{{item.0}}" value="{{item.1}}" />
                {%endfor%}


        </td>
    </tr> 
    <tr>
        <td width="10%" id="gift_content_td">
            卡密
        </td>
        <td>
            <textarea id="kami_content" name="kami_content" style="width: 90%; height: 500px"></textarea>

            <input id="gift_num" name="gift_num" value="" style="display:none;"/>
        </td>
    </tr> 
    <tr>
        <td width="10%">
        </td>
        <td>
            <input type="submit" value="提交" />
        </td>
    </tr> 
</table>
</form>


{% endblock %}
