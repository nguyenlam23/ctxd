<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.1//EN" "http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
    <head>
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
        <title>{{settings.ADMIN_STYLE_CONFIG.APP_NAME}} 管理后台({{settings.ADMIN_STYLE_CONFIG.APP_NAME_CN}})</title>
        <link REL="stylesheet" href="{{settings.MEDIA_URL}}/css/calendar.css" TYPE="text/css">
        <link REL="stylesheet" href="{{settings.MEDIA_URL}}/css/common.css" TYPE="text/css">
        <link REL="icon" href="{{settings.MEDIA_URL}}/{{settings.ADMIN_STYLE_CONFIG.ICON}}">
        <script src="{{settings.MEDIA_URL}}/js/jquery.js" type="text/javascript"></script>
        <script type='text/javascript' src='{{settings.MEDIA_URL}}/js/calendar.js'></script>
        <script type='text/javascript' src='{{settings.MEDIA_URL}}/js/c_english.js'></script>
        <script type='text/javascript' src='{{settings.MEDIA_URL}}/js/common/base.js'></script>
        <script type='text/javascript' src='{{settings.MEDIA_URL}}/js/common/request.js'></script>
        <style>
            body {
                font-family: Arial, Helvetica, sans-serif;
            }
        </style>
    </head>
    <body>
        <script type='text/javascript'>
            $(document).ready(function () {
                var current_config_type = '{{ take_config_type }}';
                if (current_config_type) {
                    if (current_config_type == 'setting') {
                        $(window.parent.frames["leftFrame"].document).find('#config_type font').text('正式配置');
                        $(window.parent.frames["leftFrame"].document).find('#test_setting').css('color', '#cccccc');
                        $(window.parent.frames["leftFrame"].document).find('#setting').css('color', '');
                    } else {
                        $(window.parent.frames["leftFrame"].document).find('#config_type font').text('测试配置');
                        $(window.parent.frames["leftFrame"].document).find('#setting').css('color', '#cccccc');
                        $(window.parent.frames["leftFrame"].document).find('#test_setting').css('color', '');
                    }
                }
            });
        </script>
        {% block content %}{% endblock %}
    </body>
</html>
