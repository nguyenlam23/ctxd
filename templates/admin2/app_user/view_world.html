<script type='text/javascript'>
    var activeZone = undefined;

    $(document).ready(function () {
        var zone = $nx.request.getUrlParam('zone', window);
        if (zone) {
            view_world(zone);
            window.location.hash="#" + zone;
        }
    });

    function view_world(zone){
        if (activeZone !== zone) {
            $('#'+activeZone).removeClass('active-zone');
            $('#'+zone).addClass('active-zone');
            activeZone = zone;
        }
        $nx.request.postfs('app_user/view_world/', {'zone': zone}, function (data) {
            $('#world_body').html(data.world_body)
        })
    }

    function change_country_advise_score(country_id) {
        var renqi_score = $("#renqi_score_" + country_id).val();
        var haoqi_score = $("#haoqi_score_" + country_id).val();
        var args = {
            zone: activeZone,
            country_id: country_id,
            haoqi_score: haoqi_score,
            renqi_score: renqi_score,
            change_key: 'change_country_advise_score',
        }
        $.post('{{ settings.BASE_URL}}/admin/app_user/change_world/', args,
                 function(data){
                     if(data.state=='success'){
                        refresh_world(data.world_json,data.world_lv,data.log_str_list);
                     }else
                        alert('出现错误: '+data.msg)
                    }, 'json')
    }

    function get_pk_yard_log(){

        var sn = $('#sn').val();
        window.open('{{settings.BASE_URL}}/admin/app_user/get_pk_yard_log/?zone='
                + activeZone + '&ym=' + ym + '&tn=' + tn + '&sn=' + sn,'newwindow','height=800,width=600,top=0,left=0,toolbar=no,menubar=no,scrollbars=no,resizable=no,location=no,status=no');
    }

    function succ(){
        return false;
        $('#desc').show();
        setTimeout("$('#desc').hide()",2000)
    }

    function refresh_world(world_json,world_lv,log_str_list){
        $('#world').val('');
        setTimeout("$('#world').val("+JSON.stringify(world_json)+")",1000)
        $('#world_lv').val(world_lv);
        $('#log_list').html(log_str_list);
    }

            for (var i=0;i<obj.length;i++){ 
                if(obj[i].checked){

            alert('出现错误: 请选择要更改状态的功能')

{%if zone_list%}
<div class="zone-list">
    <div>
        <form id="frm" action="{{settings.BASE_URL}}/admin/app_user/view_world/" method="post">
        <input type="hidden" name="zone" id="zone" value=""/>
        </form>
    </div>
    <table>
        {%for item in zone_list%}
        <tr>
            {%for k,v in item%}
                <td align="left">
                    <input  id='{{ k }}' style="{%ifequal k zone%}color:red;{%endifequal%}{%ifequal k zone%}font-weight:bold;{%endifequal%}"  value='{{v}}' type="button" onclick="view_world('{{k}}');"/>
                </td>
            {%endfor%}
        </tr>
        {%endfor%}
    </table>
</div>
{%endif%}
<br/>

<div id="world_body"></div>
{% endblock %}
