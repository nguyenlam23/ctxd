{% extends 'admin/base.html' %}
{% block content %}
<script src="{{settings.MEDIA_URL}}/js/jquery-1.12.3.min.js" type="text/javascript"></script>
<script type='text/javascript' src='{{settings.BASE_URL}}/static/js/jquery-ui-1.12.1/jquery-ui.min.js'></script>
<link rel="stylesheet" href="{{settings.BASE_URL}}/static/js/jquery-ui-1.12.1/jquery-ui.min.css" type="text/css"/>
<style type="text/css">
/*分页*/
div.page {
	padding:5px;
	font-family:Arial, Helvetica, sans-serif;
	margin-left:10px;
	background:#eee;
	margin-top:20px;
	text-align:center;
	padding-top:6px;
	color:#336699;
}
div.page a {
	padding:0px 5px; margin:2px; color:#336699; background:#eee; text-decoration:none;
}
div.page a:hover {
	color:#3399cc; background:#fff
}
div.page span.current {
	padding:0px 5px; font-weight:bold; margin:2px; color:#336699; background:#fff;
}
div.page span.disabled {
	padding:0px 5px; margin:2px; color:#797979;
}
/*分页结束*/


</style>

<script>
    function del_reward(id){
        if(confirm('确认删除吗？')){

        $.post('{{ settings.base_url }}/admin/reward/del_reward_to_user/', {
                    'id': id
                }, function(data){
                    if(data.state=='success'){
                        location.reload();
                    }else{
                        alert('出现错误: '+data.msg)
                    }
                    }, 'json');
        }
    }
</script>

<h2>扣除道具记录</h2>
<table border="1" cellpadding="0" cellspacing="0" width="100%">
    <tr>
        <td>
            Uid|Zone
        </td> 
        <td>
            Uname
        </td>
        <td>
            道具内容
        </td>
        <td>
            操作时间
        </td>
        <td>
            管理员
        </td>
    </tr>
    {%for item in res_list%}
    <tr>
        <td>
            <a href="{{settings.BASE_URL}}/admin/app_user/drop_user_prop/?uid={{item.uid}}&zone={{item.zone}}"> {{item.uid}}|{{item.zone}} </a>
        </td> 
        <td>
            {{item.uname}}
        </td>
        <td title="{{item.drop_prop_str}}">
            {{item.drop_prop_str}}
        </td>
        <td>
            {{item.subtime}}
        </td>
        <td>
            {{item.admin_user}}
        </td>
    </tr>

    {%endfor%}
            <tr>
                <td colspan="16">
                 <div class="page" style="background:#fff; margin-left:0; font-size:12px;">
        {{p.render|safe}}
                </div>
                </td>
            </tr>
</table>


{% endblock %}
