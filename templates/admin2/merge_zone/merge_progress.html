<table class="table table-hover">
    <tr>
        <td>区服</td>
        <td>状态</td>
    </tr>
    {% for item in merge_progress %}
    <tr {% ifequal item.2 1%}style="color: green"{% else %}style="color: red"{% endifequal %}>
        <td>{{ item.0 }}({{ item.1 }})</td>
        <td>
            {% ifequal item.2 1 %}
            完成
            {% else %}
            等待
            {% endifequal %}
        </td>
    </tr>
    {% endfor %}
</table>
